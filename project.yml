name: pISSWidget
options:
  bundleIdPrefix: com.pisswidget
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"

targets:
  pISSWidget:
    type: application
    platform: macOS
    sources:
      - path: pISSWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pisswidget.app
        INFOPLIST_FILE: pISSWidget/Info.plist
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        CODE_SIGN_ENTITLEMENTS: pISSWidget/pISSWidget.entitlements
    dependencies:
      - target: pISSWidgetExtension

  pISSWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: pISSWidgetExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pisswidget.app.widget
        INFOPLIST_FILE: pISSWidgetExtension/Info.plist
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
    entitlements:
      path: pISSWidgetExtension/pISSWidgetExtension.entitlements
